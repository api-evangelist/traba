aid: traba
name: Traba
description: >-
  Traba is a New York City-based staffing marketplace and AI operating layer
  for the industrial supply chain, founded in 2021 and backed by Founders
  Fund. Traba connects vetted, high-reliability light-industrial workers with
  production plants, warehouses, and distribution centers, and pairs that
  staffing marketplace with Neo, an AI intelligence layer that unifies live
  operational data across WMS, ERP, HRIS, TMS, and payroll systems, surfaces
  root causes, and automates approved supply chain workflows. Traba publishes
  no public developer API.
